[project]
name = "events-agent"
version = "0.1.0"
description = "An agent for capturing and recommending fun local events"
readme = "README.md"
authors = [
    { name = "Tom Fielden", email = "tom@tomfielden.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
events-agent = "events_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
